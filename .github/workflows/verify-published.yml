name: verify-published

# Post-publish verification: install the packages **from the registries** and use
# them. The npm/pypi smoke workflows build their artifact locally from the release
# assets, which proves the recipe — it cannot prove that what npmjs.com and PyPI
# actually serve is installable and correct. Everything here starts from
# `npm install` / `pip install`.
#
# Called by release.yml once both publish jobs are done, and runnable by hand for
# any published version (workflow_dispatch), e.g. after a registry incident.
on:
  workflow_call:
    inputs:
      version:
        description: "Release tag to verify, e.g. v1.2.3"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to verify (default: the latest release)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  # `npm install` on every OS: the launcher must resolve the ONE per-platform
  # optional dependency npm picked for this host and exec its binary. That
  # resolution is the part most likely to break in publishing (a platform package
  # missing at this version, or an optionalDependencies pin that does not match),
  # and it can only fail on the host it belongs to.
  npm:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Install from npmjs.com and use it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.version }}"
          if [ -z "$tag" ]; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          fi
          want="${tag#v}"
          echo "verifying @sofa-buffers/generator@$want"

          # Which platform package this host must end up with. Resolved before the
          # install, not after: it has to be visible on the registry *by then*.
          case "$RUNNER_OS" in
            Linux) plat=linux ;; macOS) plat=darwin ;; Windows) plat=win32 ;;
          esac
          case "$RUNNER_ARCH" in
            X64) a=x64 ;; ARM64) a=arm64 ;; X86) a=ia32 ;;
          esac

          # A publish is not instantly visible through every registry CDN edge, so
          # wait for the launcher AND this host's platform package. Both, because
          # npm resolves optionalDependencies silently: installing while the
          # platform package is still invisible does not fail the install, it just
          # leaves the package out — and the check below then reports an
          # optional-dependency resolution failure for what is only a lag. That is
          # exactly how v0.25.0 went red on a release where all nine platform
          # packages had in fact published.
          for i in $(seq 1 20); do
            if npm view "@sofa-buffers/generator@$want" version >/dev/null 2>&1 \
               && npm view "@sofa-buffers/generator-$plat-$a@$want" version >/dev/null 2>&1; then
              break
            fi
            echo "  not visible yet (attempt $i) …"; sleep 15
          done

          proj="$RUNNER_TEMP/npmproj"
          mkdir -p "$proj" && cd "$proj"
          npm init -y >/dev/null
          npm install --save-dev "@sofa-buffers/generator@$want"

          # The host's platform package must be the one npm installed. Past the wait
          # above, a miss here is a real resolution bug, not propagation.
          pkg="node_modules/@sofa-buffers/generator-$plat-$a"
          test -d "$pkg" || {
            echo "::error::$pkg was not installed — optional-dependency resolution failed" >&2
            ls node_modules/@sofa-buffers/ >&2; exit 1
          }
          echo "platform package present: $pkg"

          got="$(npx sofabgen --version)"
          echo "npx sofabgen --version -> '$got' (expected '$want')"
          test "$got" = "$want"

          # Generate real code with the published CLI.
          npx sofabgen --lang typescript \
            --in "$GITHUB_WORKSPACE/examples/messages/example.yaml" --out out
          test -s out/message.ts

          # Registry signatures + npm provenance for everything we just installed.
          npm audit signatures

  # `pip install` on every OS: PyPI must serve a wheel whose tag matches the host,
  # and pip must land the binary on PATH, executable.
  pypi:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install from PyPI and use it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.version }}"
          if [ -z "$tag" ]; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          fi
          # PyPI spells pre-releases differently from the tag; ask the builder for
          # the rule rather than restating it here.
          want="$(python packaging/pypi/build-wheels.py --version "$tag" --print-version)"
          echo "verifying sofabgen==$want"

          python -m venv "$RUNNER_TEMP/venv"
          case "$RUNNER_OS" in
            Windows) bin="$RUNNER_TEMP/venv/Scripts" ;;
            *)       bin="$RUNNER_TEMP/venv/bin" ;;
          esac
          "$bin/python" -m pip install --quiet --upgrade pip

          # Same propagation caveat as npm; --no-cache-dir so a retry cannot be
          # answered from a local cache.
          for i in $(seq 1 20); do
            if "$bin/python" -m pip install --quiet --no-cache-dir "sofabgen==$want"; then break; fi
            echo "  not installable yet (attempt $i) …"; sleep 15
          done

          got="$("$bin/sofabgen" --version)"
          echo "sofabgen --version -> '$got' (expected '$want')"
          test "$got" = "$want"

          # Generate real code with the published CLI.
          "$bin/sofabgen" --lang python --in examples/messages/example.yaml --out "$RUNNER_TEMP/gen"
          test -s "$RUNNER_TEMP/gen/message.py"

  # What the per-host jobs cannot see: whether the OTHER platforms' artifacts were
  # published at all. A host only ever installs its own, so a missing arm64 wheel or
  # a platform package that failed to publish would go unnoticed until a user hits
  # it. Check the full set through the registry APIs, plus the provenance that is
  # supposed to come with trusted publishing.
  registries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Every platform artifact is published, and attested
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.version }}"
          if [ -z "$tag" ]; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          fi
          npm_v="${tag#v}"
          pypi_v="$(python3 packaging/pypi/build-wheels.py --version "$tag" --print-version)"
          fail=0

          platforms="linux-x64 linux-ia32 linux-arm64 linux-arm darwin-x64 darwin-arm64
                     win32-x64 win32-ia32 win32-arm64"

          # This job starts seconds after the publish jobs, and a publish is not
          # instantly visible through every registry CDN edge — the npm and pypi jobs
          # above already wait the same way, this one did not, and on v0.25.0 it
          # 404'd on all nine platform packages plus the launcher within nine seconds
          # of a release where every artifact had published correctly.
          #
          # Each gate waits for its WHOLE set against one shared deadline, so a
          # release that really is incomplete still fails — it just fails after the
          # deadline instead of immediately, and the detailed passes below are what
          # name the artifact that is actually missing. Hence a timeout here does not
          # exit: it falls through and lets those passes report.
          wait_for() {
            local what="$1" attempts="$2"; shift 2
            for i in $(seq 1 "$attempts"); do
              if "$@"; then return 0; fi
              echo "  $what not complete yet (attempt $i) …"; sleep 15
            done
            echo "  $what still incomplete after the deadline — reporting below"
          }

          npm_set_visible() {
            npm view "@sofa-buffers/generator@$npm_v" version >/dev/null 2>&1 || return 1
            for t in $platforms; do
              npm view "@sofa-buffers/generator-$t@$npm_v" version >/dev/null 2>&1 || return 1
            done
          }

          pypi_set_visible() {
            local json n
            json="$(curl -fsS "https://pypi.org/pypi/sofabgen/$pypi_v/json" 2>/dev/null)" || return 1
            n="$(printf '%s' "$json" | python3 -c \
              'import json,sys; print(sum(1 for f in json.load(sys.stdin)["urls"] if f["filename"].endswith(".whl")))')" || return 1
            [ "$n" -eq 13 ]
          }

          prov_code() {
            curl -s -o /dev/null -w '%{http_code}' \
              "https://pypi.org/integrity/sofabgen/$pypi_v/$1/provenance"
          }

          wait_for "npm" 20 npm_set_visible
          wait_for "PyPI" 20 pypi_set_visible

          echo "== npm: all nine platform packages at $npm_v =="
          for t in $platforms; do
            if npm view "@sofa-buffers/generator-$t@$npm_v" version >/dev/null 2>&1; then
              echo "  ok  @sofa-buffers/generator-$t"
            else
              echo "::error::@sofa-buffers/generator-$t@$npm_v is not on the registry" >&2
              fail=1
            fi
          done

          # Guarded: an unreachable or 404 launcher must be reported as the missing
          # artifact it is, not kill the job with a raw npm error before the rest of
          # the set has been checked.
          echo "== npm: the launcher pins exactly those nine =="
          pinned="$(npm view "@sofa-buffers/generator@$npm_v" optionalDependencies --json 2>/dev/null | node -e \
            'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const o=JSON.parse(s||"{}");
             console.log(Object.entries(o).map(([k,v])=>k+"@"+v).sort().join("\n"))})')" || pinned=""
          echo "$pinned"
          test "$(echo "$pinned" | grep -c "@$npm_v\$")" -eq 9 || {
            echo "::error::the launcher does not pin nine platform packages at $npm_v" >&2; fail=1; }

          echo "== PyPI: all thirteen wheels at $pypi_v, each with attestations =="
          # 2>/dev/null on the reader too: when curl has 404'd, the empty stdout
          # makes json.load raise, and an unhandled traceback in the log reads far
          # worse than the "expected 13 wheels, found 0" error that follows.
          files="$(curl -fsS "https://pypi.org/pypi/sofabgen/$pypi_v/json" 2>/dev/null | python3 -c \
            'import json,sys; print("\n".join(sorted(f["filename"] for f in json.load(sys.stdin)["urls"])))' \
            2>/dev/null)" || files=""
          n="$(echo "$files" | grep -c '\.whl$' || true)"
          echo "$files"
          test "$n" -eq 13 || { echo "::error::expected 13 wheels on PyPI, found $n" >&2; fail=1; }

          # Attestations are served from a different endpoint than the file listing
          # and can lag behind it, so give the set its own (shorter) gate before
          # reporting any single wheel as unattested.
          prov_complete() {
            local f
            for f in $files; do
              [ "$(prov_code "$f")" = "200" ] || return 1
            done
          }
          [ -z "$files" ] || wait_for "PyPI attestations" 10 prov_complete

          for f in $files; do
            code="$(prov_code "$f")"
            if [ "$code" != "200" ]; then
              echo "::error::no PEP 740 provenance for $f (HTTP $code)" >&2; fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "all artifacts published and attested"
