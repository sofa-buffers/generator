# The shared name-collision schema (docs/ARCHITECTURE.md §8, "Naming").
#
# Every name here is legal under the three naming rules, and every one of them
# used to clash in at least one target: two schema paths that joined or folded
# to one identifier, a type spelled like a role the generator derives from
# another type, or a type spelled like a fixed, imported or builtin name the
# generated module uses. Each conformance suite builds this schema against the
# real corelib and round-trips names.json through it — the generator exits 0
# on broken output, so only building catches a clash.
#
# Keep every $defs type used by exactly one message: a $defs type shared by
# two messages is a separate C/C++ defect (one definition per header), not a
# naming one.
version: 1
$defs:
  struct:
    # A $defs type has no category prefix any more; `struct_point` below used
    # to spell the same identifier (StructPoint).
    point:
      x: { id: 0, type: i32 }
      y: { id: 1, type: i32 }
  enum:
    color: { red: 0, green: 1, blue: 2 }
  bitfield:
    flags:
      on: { pos: 0 }
      id: { pos: 1 }
  union:
    # Used with two default_ids below, so it splits into one type per default;
    # `shape_default_pt` (a message) and `shape_default.pt` (the inline option
    # of the union below) spelled the old variant name.
    shape:
      num: { id: 0, type: u8 }
      pt: { id: 1, type: struct, fields: { x: { id: 0, type: u8 } } }
    shape_default:
      pt: { id: 0, type: struct, fields: { y: { id: 0, type: u16 } } }
      other: { id: 1, type: u8 }

messages:
  # --- path clashes -------------------------------------------------------
  m:
    payload:
      a: { id: 0, type: struct, fields: { b: { id: 0, type: u8 } } }
      # role words as inline paths: M_Decoder / M_Visitor / M_New next to the
      # roles M__Decoder, _M__Visitor, M__New
      decoder: { id: 1, type: struct, fields: { x: { id: 0, type: u8 } } }
      visitor: { id: 2, type: enum, enum: { off: 0, on: 1 } }
      new: { id: 3, type: bitfield, bits: { x: { pos: 0 }, y: { pos: 1 } } }
      # an array's inline element takes the field's path; `arr_elem` is the
      # old suffix
      arr: { id: 4, type: array, items: { type: struct, count: 2, fields: { v: { id: 0, type: u8 } } } }
      arr_elem: { id: 5, type: struct, fields: { w: { id: 0, type: u16 } } }
      u: { id: 6, type: union, oneof: { id: { id: 0, type: u8 }, default: { id: 1, type: struct, fields: { z: { id: 0, type: u8 } } } } }
      s1: { id: 7, type: union, default_id: 0, oneof: { $ref: '#/$defs/union/shape' } }
      s2: { id: 8, type: union, default_id: 1, oneof: { $ref: '#/$defs/union/shape' } }
      sd: { id: 9, type: union, oneof: { $ref: '#/$defs/union/shape_default' } }
      col: { id: 10, type: enum, enum: { $ref: '#/$defs/enum/color' }, default: 0 }
      fl: { id: 11, type: bitfield, bits: { $ref: '#/$defs/bitfield/flags' } }
  m_a: { payload: { x: { id: 0, type: u8 } } }
  m_decoder: { payload: { x: { id: 0, type: u8 } } }
  m_visitor: { payload: { x: { id: 0, type: u8 } } }
  new_m: { payload: { x: { id: 0, type: u8 } } }
  a:
    payload:
      b_c: { id: 0, type: struct, fields: { x: { id: 0, type: u8 } } }
  a_b:
    payload:
      c: { id: 0, type: struct, fields: { y: { id: 0, type: u16 } } }
  struct_point:
    payload:
      p: { id: 0, type: struct, fields: { $ref: '#/$defs/struct/point' } }
  shape_default_pt: { payload: { x: { id: 0, type: u8 } } }
  color_red: { payload: { x: { id: 0, type: u8 } } }
  flags_on: { payload: { x: { id: 0, type: u8 } } }

  # --- generator roles and fixed names ------------------------------------
  decoder: { payload: { x: { id: 0, type: u8 } } }
