# The mirror of ref_union_body_to_struct: a field declared `struct` whose
# fields are a $ref to a $defs UNION (generator#776). A union holds exactly one
# option and is omitted at its default_id's default; a struct writes every
# non-default member.
version: 1
$defs:
  union:
    Shape: { circle: { id: 0, type: u8 }, square: { id: 1, type: u16 } }
messages:
  probe:
    payload:
      s: { id: 1, type: struct, fields: { $ref: '#/$defs/union/Shape' } }
