# A string union option other than default_id is always written when held, so a
# non-empty default would be sent in full (MESSAGE_SPEC §4.2 / §6).
version: 1
messages: { M: { payload: { u: { id: 0, type: union, default_id: 0, oneof: { a: { id: 0, type: u8 }, s: { id: 1, type: string, maxlen: 4, default: "ab" } } } } } }
