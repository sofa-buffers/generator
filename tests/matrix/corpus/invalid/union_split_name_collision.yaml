# Shape is used with default_id 0 and 2, so it splits into Shape_default_a and
# Shape_default_pt -- and the second is already a $defs union.
version: 1
$defs:
  union:
    Shape:
      a:  { id: 0, type: u8 }
      pt: { id: 2, type: u8 }
    Shape_default_pt:
      z: { id: 0, type: u8 }
messages:
  M:
    payload:
      x: { id: 0, type: union, default_id: 0, oneof: { $ref: "#/$defs/union/Shape" } }
      y: { id: 1, type: union, default_id: 2, oneof: { $ref: "#/$defs/union/Shape" } }
      z: { id: 2, type: union, oneof: { $ref: "#/$defs/union/Shape_default_pt" } }
