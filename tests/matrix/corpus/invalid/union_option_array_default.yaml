# An array option of a $defs union with a non-empty default: all-zero is still
# not empty (MESSAGE_SPEC §4.2 / §6).
version: 1
$defs:
  union:
    U:
      a: { id: 0, type: u8 }
      arr: { id: 1, type: array, items: { type: u8, count: 2 }, default: [0, 0] }
messages: { M: { payload: { u: { id: 0, type: union, oneof: { $ref: "#/$defs/union/U" } } } } }
