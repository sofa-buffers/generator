# Messages and every $defs category share one scope: each becomes a type at
# the top level of every target, so a message Point and a struct point meet.
version: 1
$defs:
  struct:
    point: { x: { id: 0, type: u8 } }
messages:
  Point:
    payload:
      p: { id: 0, type: struct, fields: { $ref: "#/$defs/struct/point" } }
