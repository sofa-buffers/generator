version: 1
messages:
  Arr:
    payload:
      nums:  { id: 0, type: array, items: { type: i32, count: 3 }, default: [-1, 0, 2147483647] }
      bytes: { id: 1, type: array, items: { type: u8, count: 2 }, default: [0, 255] }
      fps:   { id: 2, type: array, items: { type: fp64, count: 2 }, default: [1.0, 2.0] }
      # No `default` on either of these two. A string or blob element is lowered
      # to a WRAPPER SEQUENCE, and no code backend materializes a default for one
      # -- the member is constructed empty whatever the schema says. Carrying a
      # default here made this file a POSITIVE pin for the exact shape #497 was
      # filed against: `docs` printed ["a", "b"] in the Default column beside a
      # cpp header that started the member at {}. The negatives now live in
      # ../invalid/array_elem_string_default.yaml and array_elem_blob_default.yaml.
      strs:  { id: 3, type: array, items: { type: string, count: 2, maxlen: 8 } }
      blobs: { id: 4, type: array, items: { type: blob, count: 1, maxlen: 4 } }
      # The only element default whose value does not fit the SIGNED 64-bit carrier
      # some targets back a u64 with (java `long`, dart `int`), so it is the only one
      # that forces those backends to re-spell rather than copy the schema's decimal.
      # Every element here is emitted per INSTANCE, inside the array initializer, so
      # this row is what puts that spelling through each backend's compiler; the
      # scalar twin in scalars.yaml (`u64max`) exercises only the field-level sites.
      # Past 2^63-1 the QUOTED decimal string is the portable spelling, and the only
      # one a JSON reader of this same definition can carry: JSON has no unsigned
      # 64-bit number. 10 is here to hold the common case -- a default that fits and
      # must therefore stay the author's own decimal -- next to the two that do not.
      wides: { id: 5, type: array, items: { type: u64, count: 3 }, default: [10, "9223372036854775808", "18446744073709551615"] }
      # The unquoted twin of the middle element above. yaml.v3 hands a literal past
      # 2^63-1 over as a uint64, which the element arm reads since generator#484; the
      # arm before it went through a SIGNED int64 and rejected this as "element must
      # be an integer". It is the one shape that STARTED validating with that change,
      # so it is here to be compiled: java and dart back a u64 with a signed carrier
      # and have to re-spell it (0x8000000000000000L / 0x8000000000000000) exactly as
      # they do for the quoted form.
      wide_unquoted: { id: 6, type: array, items: { type: u64, count: 1 }, default: [9223372036854775808] }
