# The same schema as example.yaml, with a bound on every field.
#
# The no-heap profile (corelib: c-cpp, allow_dynamic: false) has no fallback
# storage, so it rejects an unbounded array or an unbounded string/blob at
# generate time. Field `free` is therefore bounded here; everything else is
# byte-for-byte the schema in example.yaml, so the two footprint outputs stay
# directly comparable.
version: 1
messages:
  probe:
    payload:
      count:  { id: 0, type: u32 }                                        # unsigned scalar
      delta:  { id: 1, type: i32 }                                        # signed scalar
      ratio:  { id: 2, type: fp64 }                                       # fixlen, subtype fp64
      name:   { id: 3, type: string, maxlen: 8 }                          # fixlen, subtype string + maxlen
      data:   { id: 4, type: blob, maxlen: 8 }                            # fixlen, subtype blob + maxlen
      fixed:  { id: 5, type: array, items: { type: u32, count: 3 } }      # native array + count
      free:   { id: 6, type: array, items: { type: u32, count: 4 } }      # bounded (no-heap profile)
      tags:   { id: 7, type: array, items: { type: string, count: 2, maxlen: 4 } }  # wrapper array
      inner:  { id: 8, type: struct, fields: { x: { id: 0, type: i32 } } }          # nested sequence
